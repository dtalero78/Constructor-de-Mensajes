name: constructor-de-mensajes
region: nyc
services:
  - name: constructor-de-mensajes
    github:
      repo: dtalero78/Constructor-de-Mensajes
      branch: interfaz-nueva-postgres-agente
      deploy_on_push: true
    dockerfile_path: ./Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: PORT
        scope: RUN_TIME
        value: "3000"
      # Los valores reales se cargan como SECRET en DigitalOcean, nunca en el repo:
      #   doctl apps update <app-id> --spec <spec-con-valores>
      # o desde la consola, en Settings → App-Level Environment Variables.
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      # Client ID de Google Identity Services. Sin él, el login por correo
      # funciona igual y el botón de Google simplemente no se muestra.
      - key: GOOGLE_CLIENT_ID
        scope: RUN_TIME
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      # Resend, para el correo de recuperar contraseña.
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MAIL_FROM
        scope: RUN_TIME
      # Base de los enlaces que van dentro de los correos.
      - key: APP_URL
        scope: RUN_TIME
