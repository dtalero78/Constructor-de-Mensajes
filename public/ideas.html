<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#22B24C" />
  <title>Ideas · LivingRoom Speakers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    /* ============================================================
       CREAR — el agente entrevistador.
       Una pregunta por pantalla → briefing → los 8 pilares.
       ============================================================ */

    :root {
      --brand: #22B24C;
      --brand-600: #17A34A;
      --brand-700: #0F8A3C;
      --brand-soft: #E9F7EE;
      --page: #EFE8E0;
      --surface: #FFFFFF;
      --surface-2: #F7F4F0;
      --line: #ECE7E1;
      --ink: #15181D;
      --ink-2: #4B5159;
      --muted: #8E949D;
      --danger: #C0392B;
      --shadow-sm: 0 2px 6px rgba(24, 20, 16, .05);
      --shadow-md: 0 6px 18px rgba(24, 20, 16, .07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--page);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 14px;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      border: 0;
      background: none;
      cursor: pointer;
      color: inherit;
    }

    .app {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border-radius: 32px;
      box-shadow: var(--shadow-md);
      padding: 18px 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* ---------- Cabecera ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .volver {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px 8px 10px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      box-shadow: var(--shadow-sm);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      transition: transform .18s ease;
    }

    .volver:hover {
      transform: translateX(-2px);
    }

    .paso {
      font-size: 12px;
      font-weight: 700;
      color: var(--brand-700);
      background: var(--brand-soft);
      padding: 6px 12px;
      border-radius: 999px;
    }

    /* ---------- Pantallas ---------- */
    .pantalla {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .pantalla.activa {
      display: flex;
      animation: entra .35s cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes entra {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    /* ---------- Historial de la entrevista ---------- */
    .historial {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 168px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .historial:empty {
      display: none;
    }

    .turno {
      background: var(--surface-2);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 12.5px;
      line-height: 1.45;
    }

    .turno b {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .turno .editar {
      font-size: 11px;
      font-weight: 700;
      color: var(--brand-700);
      margin-left: 6px;
    }

    /* ---------- La pregunta ---------- */
    .pregunta {
      font-family: 'Archivo', sans-serif;
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1.18;
      font-size: clamp(20px, 3.6vw, 28px);
    }

    .porque {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      line-height: 1.5;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .porque::before {
      content: "";
      flex: none;
      width: 3px;
      align-self: stretch;
      border-radius: 999px;
      background: var(--brand-soft);
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      font: inherit;
      font-size: 15px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--surface-2);
      border: 1.5px solid var(--line);
      border-radius: 20px;
      padding: 16px 18px;
      transition: border-color .18s ease, background .18s ease;
    }

    textarea:focus {
      outline: 0;
      background: var(--surface);
      border-color: var(--brand);
    }

    textarea::placeholder {
      color: #B7BCC3;
    }

    /* ---------- Botones ---------- */
    .acciones {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.01em;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .btn-primario {
      background: var(--brand);
      color: #fff;
      box-shadow: 0 8px 18px rgba(18, 144, 62, .3);
    }

    .btn-primario:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(18, 144, 62, .34);
    }

    .btn-primario:disabled {
      background: #C9D3CC;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-fantasma {
      color: var(--ink-2);
      border: 1.5px solid var(--line);
      background: var(--surface);
    }

    .btn-fantasma:hover {
      background: var(--surface-2);
    }

    .btn-texto {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      padding: 8px 4px;
    }

    .btn-texto:hover {
      color: var(--brand-700);
    }

    /* ---------- Estados ---------- */
    .cargando {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      padding: 8px 0;
    }

    .puntos {
      display: inline-flex;
      gap: 5px;
    }

    .puntos i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand);
      animation: latir 1s infinite ease-in-out;
    }

    .puntos i:nth-child(2) {
      animation-delay: .15s;
    }

    .puntos i:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes latir {

      0%,
      80%,
      100% {
        opacity: .25;
        transform: scale(.8);
      }

      40% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .error {
      background: #FDEDEA;
      border: 1.5px solid #F5C6BE;
      color: var(--danger);
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 13.5px;
      line-height: 1.5;
      display: none;
    }

    .error.visible {
      display: block;
    }

    .error b {
      display: block;
      margin-bottom: 3px;
    }

    .btn-reintentar {
      margin-top: 10px;
      display: inline-block;
      padding: 7px 16px;
      border-radius: 999px;
      background: var(--danger);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    /* ---------- Briefing ---------- */
    .titulo-bloque {
      font-family: 'Archivo', sans-serif;
      font-weight: 800;
      letter-spacing: -.03em;
      font-size: clamp(24px, 5.4vw, 34px);
      line-height: 1.12;
    }

    .subtitulo {
      font-size: 14px;
      color: var(--muted);
      font-weight: 500;
      line-height: 1.5;
      margin-top: 8px;
    }

    .campos {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .campo {
      border: 1.5px solid var(--line);
      border-radius: 20px;
      padding: 14px 18px;
      background: var(--surface);
      transition: border-color .18s ease;
    }

    .campo:focus-within {
      border-color: var(--brand);
    }

    .campo label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--brand-700);
      margin-bottom: 6px;
    }

    .campo textarea {
      min-height: 0;
      padding: 0;
      border: 0;
      background: none;
      border-radius: 0;
      font-size: 15px;
      field-sizing: content;
    }

    /* ---------- Tarjetas de las secciones ya hechas ---------- */
    .hechos {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hechos:empty {
      display: none;
    }

    .hecho {
      border: 1.5px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: border-color .18s ease;
    }

    .hecho.sucia {
      border-color: var(--brand);
    }

    .hecho-cabecera {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
    }

    .hecho-cabecera .num {
      width: 24px;
      height: 24px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--brand-soft);
      color: var(--brand-700);
      font-size: 11.5px;
      font-weight: 800;
    }

    .hecho-cabecera .nombre {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -.01em;
      flex: 1;
      min-width: 0;
    }

    .hecho-cabecera .marca {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    .hecho-cabecera .flecha {
      color: var(--muted);
      transition: transform .22s ease;
      flex: none;
    }

    .hecho.abierta .hecho-cabecera .flecha {
      transform: rotate(90deg);
    }

    .hecho-cuerpo {
      position: relative;
      padding: 0 16px 14px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--ink-2);
      max-height: 78px;
      overflow: hidden;
      outline: 0;
    }

    .hecho-cuerpo::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34px;
      background: linear-gradient(to top, var(--surface), transparent);
      pointer-events: none;
    }

    .hecho.abierta .hecho-cuerpo {
      max-height: none;
      overflow: visible;
    }

    .hecho.abierta .hecho-cuerpo::after {
      display: none;
    }

    .hecho-pie {
      display: none;
      gap: 10px;
      align-items: center;
      padding: 0 16px 14px;
    }

    .hecho.sucia .hecho-pie {
      display: flex;
    }

    .btn-mini {
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      background: var(--brand);
      color: #fff;
    }

    .btn-mini.gris {
      background: var(--surface-2);
      color: var(--ink-2);
    }

    .cabecera-mensaje {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .hecho.vacia .hecho-cuerpo {
      color: var(--muted);
      font-style: italic;
    }

    .hecho.vacia .hecho-pie,
    .hecho.abierta .hecho-pie {
      display: flex;
    }

    .hecho.generando .hecho-cuerpo {
      opacity: .5;
    }

    .consolidado {
      background: var(--surface-2);
      border: 1.5px solid var(--line);
      border-radius: 22px;
      padding: 26px 28px;
      font-size: 15px;
      line-height: 1.7;
    }

    .consolidado h2 {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--brand-700);
      margin: 26px 0 8px;
    }

    .consolidado h2:first-child {
      margin-top: 0;
    }

    .consolidado p {
      margin-bottom: 10px;
      white-space: pre-wrap;
    }

    /* ---------- Construcción ---------- */
    .barra {
      height: 8px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
    }

    .barra i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #35C963, #12903E);
      transition: width .4s cubic-bezier(.22, 1, .36, 1);
    }

    .pilar-nombre {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--brand-700);
    }

    .pilar-nombre span {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--brand-soft);
      letter-spacing: 0;
    }

    .propuesta {
      border: 1.5px solid var(--line);
      border-radius: 22px;
      padding: 18px 20px;
      background: var(--surface-2);
      font-size: 15px;
      line-height: 1.65;
      min-height: 120px;
      transition: border-color .18s ease, background .18s ease;
    }

    .propuesta:focus {
      outline: 0;
      background: var(--surface);
      border-color: var(--brand);
    }

    .propuesta strong {
      font-weight: 700;
    }

    .propuesta ul {
      margin: 8px 0 8px 18px;
    }

    details {
      border-top: 1.5px solid var(--line);
      padding-top: 12px;
    }

    summary {
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
    }

    details p {
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink-2);
      margin-top: 8px;
    }

    .listo-icono {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 12px 24px rgba(18, 144, 62, .32);
    }

    @media (min-width: 760px) {
      body {
        padding: 30px;
      }

      .app {
        padding: 26px 34px 36px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <a class="volver" href="/home.html">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6" />
        </svg>
        Inicio
      </a>
      <span class="paso">Ideas</span>
    </header>

    <div class="error" id="error"></div>

    <section class="pantalla activa">
      <div>
        <h1 class="titulo-bloque">¿Qué se te ocurrió?</h1>
        <p class="subtitulo">Suelta la idea como venga. Te digo a cuál de los 8 pilares pertenece,
          para que no se pierda mientras armas el mensaje.</p>
      </div>

      <textarea id="idea" placeholder="Una historia, una frase, una imagen, una pregunta…"></textarea>

      <div class="acciones">
        <button class="btn btn-primario" id="btnClasificar">¿Dónde va esta idea?</button>
      </div>

      <div class="cargando" id="cargando" style="display:none">
        <span class="puntos"><i></i><i></i><i></i></span> Ubicando la idea…
      </div>

      <article class="consolidado" id="resultado" style="display:none"></article>
    </section>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    const esc = (t = '') => String(t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    function formatOpenAiText(texto) {
      if (!texto) return '';
      let t = esc(texto);
      t = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      t = t.replace(/^### (.*)$/gm, '<strong>$1</strong>');
      t = t.replace(/^- (.*)$/gm, '<li>$1</li>');
      t = t.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
      return t.replace(/\n/g, '<br>');
    }

    const usuario = (localStorage.getItem('currentUser') || '').trim() || 'Usuario';

    $('#btnClasificar').addEventListener('click', async () => {
      const idea = $('#idea').value.trim();
      if (!idea) { $('#idea').focus(); return; }

      $('#error').classList.remove('visible');
      $('#resultado').style.display = 'none';
      $('#cargando').style.display = 'flex';
      $('#btnClasificar').disabled = true;

      try {
        const r = await fetch('/clasificar-idea', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idea, usuario })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || `El servidor respondió ${r.status}`);
        $('#resultado').innerHTML = formatOpenAiText(data.clasificacion || '');
        $('#resultado').style.display = 'block';
      } catch (err) {
        $('#error').innerHTML = `<b>No pude clasificar la idea.</b>${esc(err.message)}`;
        $('#error').classList.add('visible');
      } finally {
        $('#cargando').style.display = 'none';
        $('#btnClasificar').disabled = false;
      }
    });

    $('#idea').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('#btnClasificar').click();
    });
  </script>
</body>

</html>
