<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#22B24C" />
  <title>Entrar · LivingRoom Speakers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/estilos.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
/* ============================================================
       CREAR — el agente entrevistador.
       Una pregunta por pantalla → briefing → los 8 pilares.
       ============================================================ */
/* ---------- Historial de la entrevista ---------- */
    .historial {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 168px;
      overflow-y: auto;
      padding-right: 4px;
    }

.historial:empty {
      display: none;
    }

.turno {
      background: var(--surface-2);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 12.5px;
      line-height: 1.45;
    }

.turno b {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 2px;
    }

.turno .editar {
      font-size: 11px;
      font-weight: 700;
      color: var(--brand-700);
      margin-left: 6px;
    }

/* ---------- La pregunta ---------- */
    .pregunta {
      font-family: 'Archivo', sans-serif;
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1.18;
      font-size: clamp(20px, 3.6vw, 28px);
    }

.porque {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      line-height: 1.5;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

.porque::before {
      content: "";
      flex: none;
      width: 3px;
      align-self: stretch;
      border-radius: 999px;
      background: var(--brand-soft);
    }

/* ---------- Tarjetas de las secciones ya hechas ---------- */
    .hechos {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

.hechos:empty {
      display: none;
    }

.hecho {
      border: 1.5px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: border-color .18s ease;
    }

.hecho.sucia {
      border-color: var(--brand);
    }

.hecho-cabecera {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
    }

.hecho-cabecera .num {
      width: 24px;
      height: 24px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--brand-soft);
      color: var(--brand-700);
      font-size: 11.5px;
      font-weight: 800;
    }

.hecho-cabecera .nombre {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -.01em;
      flex: 1;
      min-width: 0;
    }

.hecho-cabecera .marca {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

.hecho-cabecera .flecha {
      color: var(--muted);
      transition: transform .22s ease;
      flex: none;
    }

.hecho.abierta .hecho-cabecera .flecha {
      transform: rotate(90deg);
    }

.hecho-cuerpo {
      position: relative;
      padding: 0 16px 14px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--ink-2);
      max-height: 78px;
      overflow: hidden;
      outline: 0;
    }

.hecho-cuerpo::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34px;
      background: linear-gradient(to top, var(--surface), transparent);
      pointer-events: none;
    }

.hecho.abierta .hecho-cuerpo {
      max-height: none;
      overflow: visible;
    }

.hecho.abierta .hecho-cuerpo::after {
      display: none;
    }

.hecho-pie {
      display: none;
      gap: 10px;
      align-items: center;
      padding: 0 16px 14px;
    }

.hecho.sucia .hecho-pie {
      display: flex;
    }

.cabecera-mensaje {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

.hecho.vacia .hecho-cuerpo {
      color: var(--muted);
      font-style: italic;
    }

.hecho.vacia .hecho-pie,
    .hecho.abierta .hecho-pie {
      display: flex;
    }

.hecho.generando .hecho-cuerpo {
      opacity: .5;
    }

/* ---------- Construcción ---------- */
    .barra {
      height: 8px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
    }

.barra i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #35C963, #12903E);
      transition: width .4s cubic-bezier(.22, 1, .36, 1);
    }

.pilar-nombre {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--brand-700);
    }

.pilar-nombre span {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--brand-soft);
      letter-spacing: 0;
    }

.propuesta {
      border: 1.5px solid var(--line);
      border-radius: 22px;
      padding: 18px 20px;
      background: var(--surface-2);
      font-size: 15px;
      line-height: 1.65;
      min-height: 120px;
      transition: border-color .18s ease, background .18s ease;
    }

.propuesta:focus {
      outline: 0;
      background: var(--surface);
      border-color: var(--brand);
    }

.propuesta strong {
      font-weight: 700;
    }

.propuesta ul {
      margin: 8px 0 8px 18px;
    }

details {
      border-top: 1.5px solid var(--line);
      padding-top: 12px;
    }

summary {
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
    }

details p {
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink-2);
      margin-top: 8px;
    }

.listo-icono {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 12px 24px rgba(18, 144, 62, .32);
    }

@media (min-width: 760px) {
      body {
        padding: 30px;
      }

      .app {
        padding: 26px 34px 36px;
      }
    }
  </style>
  <style>
.app { max-width: 460px; }

.marca {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

.marca-icono {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(140deg, #35C963, #12903E);
      color: #fff;
      display: grid;
      place-items: center;
      flex: none;
    }

.marca strong {
      font-family: 'Archivo', sans-serif;
      font-weight: 800;
      letter-spacing: -.03em;
      font-size: 20px;
    }

.campo-simple {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

.campo-simple label {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-2);
    }

.campo-simple input {
      font: inherit;
      font-size: 15px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink);
      transition: border-color .18s ease, background .18s ease;
    }

.campo-simple input:focus {
      outline: 0;
      background: var(--surface);
      border-color: var(--brand);
    }

.separador {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

.separador::before,
    .separador::after {
      content: "";
      flex: 1;
      height: 1.5px;
      background: var(--line);
    }

.btn-google {
      width: 100%;
      justify-content: center;
      border: 1.5px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }

.btn-google:hover {
      background: var(--surface-2);
    }

#googleNativo {
      display: flex;
      justify-content: center;
    }

.cambiar {
      font-size: 13.5px;
      color: var(--muted);
      text-align: center;
    }

.cambiar button {
      font-weight: 700;
      color: var(--brand-700);
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="marca">
      <span class="marca-icono">
        <svg viewBox="0 0 64 64" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M32 7c14 0 25 8.9 25 20s-11 20-25 20a29 29 0 0 1-7.6-1l-13.6 6.6 3.4-9.7C8.7 39.2 7 33.4 7 27 7 15.9 18 7 32 7Z" />
          <path d="M20.5 30.5v-4.2a3 3 0 0 1 3-3h17a3 3 0 0 1 3 3v4.2" />
          <path d="M18.5 30.5a3 3 0 0 1 3 3v4h21v-4a3 3 0 0 1 3-3" />
        </svg>
      </span>
      <strong>LivingRoom Speakers</strong>
    </div>

    <div>
      <h1 class="titulo-bloque" id="titulo">Entra a construir</h1>
      <p class="subtitulo" id="subtitulo">Tus mensajes quedan guardados en tu cuenta.</p>
    </div>

    <div class="error" id="error"></div>

    <form id="formulario" class="campos" autocomplete="on">
      <div class="campo-simple" id="campoNombre" style="display:none">
        <label for="nombre">Tu nombre</label>
        <input id="nombre" type="text" autocomplete="name" placeholder="Como quieres que te llamemos" />
      </div>
      <div class="campo-simple">
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="email" required placeholder="tu@correo.com" />
      </div>
      <div class="campo-simple">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="current-password" required placeholder="Mínimo 8 caracteres" />
      </div>

      <button class="btn btn-primario" id="btnEnviar" type="submit">Entrar</button>
    </form>

    <p class="cambiar" id="olvide">
      <button type="button" id="btnOlvide">¿Olvidaste tu contraseña?</button>
    </p>

    <div class="separador" id="separador">o</div>
    <div id="googleNativo"></div>
    <button class="btn btn-google" id="btnGoogleRespaldo" style="display:none">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
      </svg>
      Continuar con Google
    </button>

    <p class="cambiar" id="cambiar">
      ¿No tienes cuenta? <button type="button" id="btnCambiar">Créala aquí</button>
    </p>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const esc = (t = '') => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    let modo = 'entrar';   // 'entrar' | 'registro'
    const destino = new URLSearchParams(location.search).get('volver') || '/';

    function pintarModo() {
      const registro = modo === 'registro';
      $('#titulo').textContent = registro ? 'Crea tu cuenta' : 'Entra a construir';
      $('#subtitulo').textContent = registro
        ? 'Con una cuenta, tus mensajes te siguen a cualquier dispositivo.'
        : 'Tus mensajes quedan guardados en tu cuenta.';
      $('#campoNombre').style.display = registro ? 'flex' : 'none';
      $('#btnEnviar').textContent = registro ? 'Crear cuenta' : 'Entrar';
      $('#clave').autocomplete = registro ? 'new-password' : 'current-password';
      $('#olvide').style.display = registro ? 'none' : 'block';
      $('#cambiar').innerHTML = registro
        ? '¿Ya tienes cuenta? <button type="button" id="btnCambiar">Entra aquí</button>'
        : '¿No tienes cuenta? <button type="button" id="btnCambiar">Créala aquí</button>';
      $('#btnCambiar').addEventListener('click', () => {
        modo = registro ? 'entrar' : 'registro';
        $('#error').classList.remove('visible');
        pintarModo();
      });
    }

    function mostrarError(mensaje) {
      $('#error').innerHTML = `<b>${esc(mensaje)}</b>`;
      $('#error').classList.add('visible');
    }

    async function enviar(ruta, cuerpo) {
      $('#btnEnviar').disabled = true;
      $('#error').classList.remove('visible');
      try {
        const r = await fetch(ruta, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(cuerpo)
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || `El servidor respondió ${r.status}`);
        location.replace(destino);
      } catch (err) {
        mostrarError(err.message);
      } finally {
        $('#btnEnviar').disabled = false;
      }
    }

    // ---------- Recuperar contraseña ----------
    $('#btnOlvide').addEventListener('click', async () => {
      const email = $('#email').value.trim();
      if (!email) {
        mostrarError('Escribe tu correo arriba y vuelve a tocar aquí.');
        $('#email').focus();
        return;
      }
      $('#btnOlvide').disabled = true;
      $('#btnOlvide').textContent = 'Enviando…';
      try {
        const r = await fetch('/auth/recuperar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || `El servidor respondió ${r.status}`);
        $('#olvide').innerHTML =
          `<span style="color:var(--brand-700);font-weight:700">Revisa tu correo.</span> ` +
          `Si ${esc(email)} tiene cuenta, le llega el enlace. Vence en una hora.`;
      } catch (err) {
        mostrarError(err.message);
        $('#btnOlvide').disabled = false;
        $('#btnOlvide').textContent = '¿Olvidaste tu contraseña?';
      }
    });

    $('#formulario').addEventListener('submit', (e) => {
      e.preventDefault();
      const cuerpo = { email: $('#email').value.trim(), clave: $('#clave').value };
      if (modo === 'registro') {
        cuerpo.nombre = $('#nombre').value.trim();
        enviar('/auth/registro', cuerpo);
      } else {
        enviar('/auth/entrar', cuerpo);
      }
    });

    // ---------- Google Identity Services ----------
    (async function prepararGoogle() {
      let clientId = null;
      try {
        clientId = (await (await fetch('/auth/config')).json()).googleClientId;
      } catch (e) { /* sin config, seguimos con correo */ }

      if (!clientId) {
        // Sin GOOGLE_CLIENT_ID el botón no aparece: mejor eso que un botón que falla.
        $('#separador').style.display = 'none';   // sin Google, un separador que no separa nada
        return;
      }

      const arrancar = () => {
        if (!window.google?.accounts?.id) return setTimeout(arrancar, 250);
        google.accounts.id.initialize({
          client_id: clientId,
          callback: ({ credential }) => enviar('/auth/google', { credential })
        });
        google.accounts.id.renderButton($('#googleNativo'), {
          theme: 'outline', size: 'large', shape: 'pill',
          text: 'continue_with', locale: 'es', width: 320
        });
      };
      arrancar();
    })();

    pintarModo();
  </script>
</body>

</html>
