<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tutor Alpha - Livingroom</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      margin: 0;
      padding: 2em;
      background-color: #fafafa;
      color: #333;
    }

    .centered {
      max-width: 800px;
      margin: 0 auto;
    }

    h1, h3, h4 {
      text-align: center;
    }

    textarea {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
      min-height: 160px;
    }

    button {
      background-color: #000;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
      border-radius: 6px;
      font-family: 'IBM Plex Sans', sans-serif;
    }

    button:hover {
      background-color: #444;
    }

    .suggestion-card {
      background-color: #fff;
      padding: 1em;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
      margin-bottom: 1.5em;
    }

    details {
      margin-top: 1em;
    }

    summary {
      cursor: pointer;
      color: #007acc;
    }

    .guardar-btn, .nueva-btn {
      background-color: #007acc;
      font-size: 13px;
      margin-right: 0.5em;
    }
  </style>
</head>
<body>
  <div class="centered">
    <h1>🧠 Tutor de Mensajes Livingroom</h1>

    <div id="tutorBox">
      <h3 id="tutorQuestion"></h3>
      <input id="tutorAnswer" type="text" style="width: 100%; padding: 10px; font-size: 14px; margin-top: 0.5em;" />
      <button id="tutorNext" style="margin-top: 1em;">Siguiente</button>
    </div>

    <div id="tutorHistory" style="margin-top: 2em;"></div>
  </div>

  <script src="tutor-alpha.js"></script>
</body>
</html>
