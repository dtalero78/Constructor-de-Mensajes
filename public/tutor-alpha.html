<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Alpha - Constructor de Mensajes</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: 'IBM Plex Sans', sans-serif; background: #f4f4f4; }
        .tutor-container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 0 10px #0001; padding: 2em; }
        .tutor-question { font-size: 1.2em; margin-bottom: 1em; }
        .tutor-input { width: 100%; padding: 0.7em; margin-bottom: 1em; border-radius: 4px; border: 1px solid #ccc; }
        .tutor-btn { background: #ffb300; color: #222; border: none; padding: 0.7em 2em; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>

<body>
    <div class="tutor-container">
        <div class="tutor-question" id="tutorQuestion">
            ¿Cuál es la idea principal de tu mensaje?
        </div>
        <textarea class="tutor-input" id="tutorAnswer" rows="3" placeholder="Escribe tu respuesta aquí..."></textarea>
        <button class="tutor-btn" id="tutorNext">Siguiente</button>
        <div id="tutorHistory" style="margin-top:2em;"></div>
    </div>

    <script src="tutor-alpha.js"></script>
</body>

</html>
